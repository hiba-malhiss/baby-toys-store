# HTTP -> HTTPS
server {
    listen 80;
    server_name admin.alkatatib.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.alkatatib.cloud;

    ssl_certificate     /etc/letsencrypt/live/admin.alkatatib.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.alkatatib.cloud/privkey.pem;

    # redirect / -> /admin/
    location = / {
        return 301 /admin/;
    }

# serve root assets that the app requests (e.g. /assets/kit-images/logo.png)
location /assets/ {
    proxy_pass http://admin-docker:80/assets/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    # IMPORTANT: /admin/ -> /  (strip the prefix)
    location /admin/ {
        proxy_pass http://admin-docker:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # optional: exact /admin -> /admin/
    location = /admin {
        return 301 /admin/;
    }
}