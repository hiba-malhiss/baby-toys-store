# =========================
# store.alkatatib.cloud
# Full Docker (store-docker + backend-docker)
# =========================

server {
    listen 80;
    server_name store.alkatatib.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name store.alkatatib.cloud;

    ssl_certificate     /etc/letsencrypt/live/store.alkatatib.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.alkatatib.cloud/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # API -> backend
    location ^~ /api/ {
        proxy_pass http://backend-docker:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) { return 204; }
    }

    # Frontend -> store container
    location / {
        proxy_pass http://store-docker:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}