# HTTP -> serve ACME + redirect everything else
# phpMyAdmin access
server {
    listen 80;
    server_name pma.alkatatib.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS -> phpMyAdmin
server {
    listen 443 ssl;
    server_name pma.alkatatib.cloud;

    ssl_certificate     /etc/letsencrypt/live/pma.alkatatib.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pma.alkatatib.cloud/privkey.pem;

    location / {
        proxy_pass http://phpmyadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}