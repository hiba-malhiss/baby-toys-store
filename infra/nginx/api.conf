server {
    listen 80;
    server_name api.alkatatib.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.alkatatib.cloud;

    ssl_certificate     /etc/letsencrypt/live/api.alkatatib.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alkatatib.cloud/privkey.pem;

    location / {

        # ---- CORS (allow store + admin) ----
        set $cors_origin "";
        if ($http_origin ~* ^https://(store|admin)\.alkatatib\.cloud$) {
            set $cors_origin $http_origin;
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "x-cart-token, Authorization, Content-Type, Accept, Accept-Language, Origin, X-Requested-With, X-XSRF-TOKEN" always;
        add_header Vary "Origin" always;

        # Preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_set_header Origin "";
        proxy_pass http://backend-docker:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Cart-Token $http_x_cart_token;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}